name: Deploy to AWS EC2

on:
  pull_request:
    branches: [ "main" ]
    types: [ "closed" ]   # PR이 닫힐 때 트리거 (머지 포함)

jobs:
  deploy:
    # 머지된 PR만 진행
    if: github.event.pull_request.merged == true
      # && contains(github.event.pull_request.labels.*.name, 'backend')
      # && contains(github.event.pull_request.labels.*.name, 'operation')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (cache on)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 실행가능 부트 JAR 생성 (Spring Boot 권장)
      - name: Build jar
        run: ./gradlew clean bootJar --no-daemon --stacktrace
        # 프로젝트가 서브폴더에 있다면 아래처럼 지정
        # working-directory: ./backend

      # 가장 최근 생성된 JAR 경로 추출
      - name: Locate jar
        id: pkg
        run: |
          JAR_PATH=$(ls -t build/libs/*-SNAPSHOT.jar 2>/dev/null | head -n1 || true)
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(ls -t build/libs/*.jar | head -n1)
          fi
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found"; exit 1
          fi
          echo "jar=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_PATH"
        # working-directory: ./backend

      # EC2로 업로드
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ${{ steps.pkg.outputs.jar }}
          target: /home/${{ secrets.SSH_USER }}/apps/pamo-be/app.jar

      # EC2에서 기존 앱 종료 후 새로 실행
      - name: Restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SSH_USER }}/apps/pamo-be"
            mkdir -p "$APP_DIR/logs"
            # 사용중인 포트 예: 8080
            if lsof -ti :8080 >/dev/null; then
              kill -9 $(lsof -ti :8080)
            fi
            nohup java -jar "$APP_DIR/app.jar" \
              --spring.profiles.active=prod \
              > "$APP_DIR/logs/app.out" 2>&1 < /dev/null &
            sleep 2
            tail -n 80 "$APP_DIR/logs/app.out" || true
