name: Deploy to AWS EC2 (Docker + GHCR)

on:
  pull_request:
    branches: [ "main" ]
    types: [ "closed" ] # PR 닫힘(=머지 포함) 시 트리거

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # GHCR 푸시 권한

    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/2025-pamo/pamo-be
      IMAGE_TAG_SHA: ${{ github.sha }}
      IMAGE_TAG_LATEST: latest
      CONTAINER_NAME: pamo-be
      APP_PORT: "8080" # 컨테이너 내부 포트

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .              # Dockerfile 위치가 다르면 수정
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHA }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy on EC2 (pull & restart container)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_NAME,IMAGE_TAG_SHA,IMAGE_TAG_LATEST,CONTAINER_NAME,APP_PORT,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            # 1) Docker 설치(없으면)
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER || true
            fi

            # 2) GHCR 로그인
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            IMAGE="$IMAGE_NAME:$IMAGE_TAG_SHA"

            # 3) 최신 이미지 pull
            docker pull "$IMAGE"

            # 4) 기존 컨테이너 중지/삭제
            if [ "$(docker ps -aq -f name=^${CONTAINER_NAME}$)" ]; then
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
            fi

            # 5) 새 컨테이너 기동
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:${APP_PORT} \
              "$IMAGE"

            # 6) 정리
            docker image prune -f || true

            # 7) 상태 확인
            sleep 2
            docker ps --filter "name=$CONTAINER_NAME" --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"
